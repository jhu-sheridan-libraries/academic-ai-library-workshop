name: Release Workshop Materials

on:
  push:
    # jhu-main is the branded JHU Sheridan Libraries branch and the only one that
    # publishes. `main` is deliberately excluded: in this fork it tracks upstream.
    # Getting this wrong is quiet and costly: the public zip keeps serving stale
    # materials while the repo looks current.
    branches: [jhu-main]
    paths:
      - 'src/content/library-context/**'
      - 'plugins/library-ai-workshop-facilitator/skills/practice-library-reference-interview/**'
      - 'plugins/library-ai-workshop-facilitator/skills/review-ai-research-output/**'
      - 'scripts/package-workshop-skills.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Package practice skills
        run: bash scripts/package-workshop-skills.sh src/content/library-context/skills

      - name: Package library-context
        run: |
          cd src/content
          zip -r ../../library-context.zip library-context/

      - name: Update workshop-materials release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete workshop-materials --yes --cleanup-tag 2>/dev/null || true
          gh release create workshop-materials library-context.zip \
            --title "Workshop Materials" \
            --notes $'Download **library-context.zip**, unzip it, and navigate to the `library-context/` folder to begin the exercises.' \
            --latest=false
