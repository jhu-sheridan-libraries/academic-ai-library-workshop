name: Deploy to GitHub Pages

on:
  push:
    # jhu-main is the branded JHU Sheridan Libraries branch and the one that should
    # publish. `main` is retained only because a fork's default may still point there;
    # if this repository has no `main`, the extra entry is simply never matched.
    branches: [jhu-main, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          PUBLIC_STATIC: 'true'
          # Institutional branding is hardcoded in src/routes/+layout.svelte so that a
          # missing variable cannot publish an unbranded site. Only the cohort label is
          # configured here.
          PUBLIC_COHORT: fall2026
          # GitHub Pages serves from /repo-name/ for project pages.
          # Remove BASE_PATH (or set it to '') for a custom domain or user/org root page.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
