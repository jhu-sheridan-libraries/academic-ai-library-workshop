<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-label="Diagram of the Windows sign-in screen with the hamburger menu open, Help and Troubleshooting expanded, and Enable Developer Mode highlighted">
<style>
  text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .item { font-size: 13.5px; fill: #23272e; }
  .itemS{ font-size: 13.5px; fill: #ffffff; }
  .ann  { font-size: 12.5px; font-weight: 600; fill: #d93025; }
  .cap  { font-size: 13px; fill: #5a616b; }
  .sign { font-size: 15px; font-weight: 600; fill: #8f959d; }
  .ph   { font-size: 12.5px; fill: #b3b8bf; }
  .tag  { font-size: 11px; fill: #8a9099; }
</style>

<rect width="860" height="500" fill="#eef1f4"/>

<!-- app window -->
<rect x="70" y="30" width="720" height="400" rx="6" fill="#ffffff" stroke="#c9ced4"/>
<rect x="70" y="30" width="720" height="34" fill="#f3f4f6"/>
<line x1="70" y1="64" x2="790" y2="64" stroke="#dfe3e7"/>
<text x="768" y="52" class="item" text-anchor="end">✕</text>

<!-- hamburger -->
<line x1="94" y1="41" x2="114" y2="41" stroke="#3c4149" stroke-width="2"/>
<line x1="94" y1="47" x2="114" y2="47" stroke="#3c4149" stroke-width="2"/>
<line x1="94" y1="53" x2="114" y2="53" stroke="#3c4149" stroke-width="2"/>
<circle cx="104" cy="47" r="19" fill="none" stroke="#d93025" stroke-width="2.5"/>
<text x="140" y="52" class="ann">menu button, top-left</text>

<!-- faded sign-in card behind -->
<g opacity="0.45">
  <rect x="330" y="300" width="290" height="112" rx="8" fill="#fafbfc" stroke="#dfe3e7"/>
  <text x="352" y="330" class="sign">Sign in to Claude</text>
  <rect x="352" y="344" width="246" height="28" rx="5" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="364" y="363" class="ph">you@library.edu</text>
  <rect x="352" y="380" width="246" height="26" rx="5" fill="#c9ced4"/>
</g>

<!-- level 1 menu -->
<rect x="86" y="74" width="190" height="122" rx="6" fill="#ffffff" stroke="#cfd4da"/>
<text x="104" y="102" class="item">Settings</text>
<rect x="90" y="112" width="182" height="28" rx="4" fill="#1a6be0"/>
<text x="104" y="131" class="itemS">Help</text>
<text x="258" y="131" class="itemS" text-anchor="end">▸</text>
<line x1="96" y1="152" x2="266" y2="152" stroke="#e0e4e8"/>
<text x="104" y="180" class="item">About Claude</text>

<!-- level 2 menu -->
<rect x="280" y="106" width="206" height="100" rx="6" fill="#ffffff" stroke="#cfd4da"/>
<text x="298" y="134" class="item">Documentation</text>
<rect x="284" y="146" width="198" height="28" rx="4" fill="#1a6be0"/>
<text x="298" y="165" class="itemS">Troubleshooting</text>
<text x="468" y="165" class="itemS" text-anchor="end">▸</text>

<!-- level 3 menu -->
<rect x="490" y="140" width="250" height="100" rx="6" fill="#ffffff" stroke="#cfd4da"/>
<text x="508" y="168" class="item">Show Logs</text>
<line x1="500" y1="184" x2="730" y2="184" stroke="#e0e4e8"/>
<text x="508" y="216" class="item">Enable Developer Mode</text>
<rect x="498" y="196" width="234" height="30" rx="6" fill="none" stroke="#d93025" stroke-width="2.5"/>
<path d="M615 262 L615 244" stroke="#d93025" stroke-width="2.5"/>
<path d="M615 244 l-5 10 h10 z" fill="#d93025"/>
<text x="615" y="280" class="ann" text-anchor="middle">choose this</text>

<text x="94" y="240" class="cap">The path is easier to reach from the sign-in</text>
<text x="94" y="260" class="cap">screen than from inside the application.</text>

<text x="94" y="462" class="cap">Help → Troubleshooting → Enable Developer Mode</text>
<text x="840" y="462" class="tag" text-anchor="end">Illustration · not a screenshot · your screen may differ</text>
</svg>
