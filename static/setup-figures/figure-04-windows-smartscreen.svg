<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-label="Diagram of the Windows protected your PC dialog expanded by More info, with the publisher name and the Run anyway button highlighted">
<style>
  text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .h    { font-size: 21px; fill: #ffffff; }
  .body { font-size: 13px; fill: #e8ebef; }
  .meta { font-size: 13px; fill: #ffffff; }
  .metaK{ font-size: 13px; fill: #b9c2cc; }
  .btn  { font-size: 13.5px; fill: #ffffff; }
  .link { font-size: 13px; fill: #9fd0ff; }
  .ann  { font-size: 12.5px; font-weight: 600; fill: #ff8a80; }
  .tag  { font-size: 11px; fill: #8a9099; }
</style>

<rect width="860" height="540" fill="#f4f6f8"/>

<!-- dialog -->
<rect x="150" y="70" width="560" height="366" rx="4" fill="#1f3a5f"/>
<rect x="150" y="70" width="560" height="34" rx="4" fill="#16293f"/>
<text x="694" y="92" class="body" text-anchor="end">✕</text>

<text x="186" y="152" class="h">Windows protected your PC</text>
<text x="186" y="188" class="body">Microsoft Defender SmartScreen prevented an unrecognised app from</text>
<text x="186" y="208" class="body">starting. Running this app might put your PC at risk.</text>

<!-- more info panel -->
<line x1="186" y1="236" x2="674" y2="236" stroke="#39567d"/>
<text x="186" y="266" class="metaK">App:</text>
<text x="266" y="266" class="meta">Claude-Setup-x64.exe</text>
<text x="186" y="292" class="metaK">Publisher:</text>
<text x="266" y="292" class="meta">Anthropic PBC</text>

<!-- publisher highlight -->
<rect x="256" y="276" width="150" height="24" rx="5" fill="none" stroke="#ff8a80" stroke-width="2.5"/>
<text x="424" y="293" class="ann">check the publisher</text>

<text x="186" y="326" class="link">More info</text>

<!-- buttons -->
<rect x="392" y="368" width="128" height="34" rx="3" fill="#2d4a72" stroke="#6f8bb0"/>
<text x="456" y="390" class="btn" text-anchor="middle">Run anyway</text>

<rect x="536" y="368" width="128" height="34" rx="3" fill="#2d4a72" stroke="#6f8bb0"/>
<text x="600" y="390" class="btn" text-anchor="middle">Don’t run</text>

<rect x="382" y="358" width="148" height="54" rx="8" fill="none" stroke="#ff8a80" stroke-width="2.5"/>
<path d="M456 458 L456 442" stroke="#d93025" stroke-width="2.5"/>
<path d="M456 442 l-5 10 h10 z" fill="#d93025"/>
<text x="456" y="476" style="font-size:12.5px;font-weight:600;fill:#d93025" text-anchor="middle">then click Run anyway</text>

<text x="840" y="502" class="tag" text-anchor="end">Illustration · not a screenshot · your screen may differ</text>
</svg>
