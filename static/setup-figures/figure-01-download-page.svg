<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-label="Diagram of the claude.com/download page with the primary download button highlighted">
<style>
  text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .h    { font-size: 30px; font-weight: 700; fill: #12141a; }
  .sub  { font-size: 15px; fill: #5a616b; }
  .lbl  { font-size: 13px; fill: #3c4149; }
  .btnT { font-size: 15px; font-weight: 600; fill: #ffffff; }
  .mono { font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 12.5px; fill: #3c4149; }
  .ann  { font-size: 12.5px; font-weight: 600; fill: #d93025; }
  .tag  { font-size: 11px; fill: #8a9099; }
</style>

<rect width="860" height="540" fill="#f4f6f8"/>

<!-- browser window -->
<rect x="20" y="20" width="820" height="450" rx="8" fill="#ffffff" stroke="#c9ced4"/>
<path d="M20 28 a8 8 0 0 1 8-8 h804 a8 8 0 0 1 8 8 v68 h-820 z" fill="#eef0f3"/>
<line x1="20" y1="96" x2="840" y2="96" stroke="#c9ced4"/>
<circle cx="42" cy="42" r="5.5" fill="#ff5f57"/>
<circle cx="60" cy="42" r="5.5" fill="#febc2e"/>
<circle cx="78" cy="42" r="5.5" fill="#28c840"/>
<rect x="100" y="27" width="196" height="30" rx="6" fill="#ffffff" stroke="#d7dbe0"/>
<text x="114" y="47" class="lbl">Download Claude</text>
<rect x="40" y="64" width="780" height="26" rx="13" fill="#ffffff" stroke="#d7dbe0"/>
<text x="58" y="81" class="mono">claude.com/download</text>

<!-- page content -->
<text x="70" y="172" class="h">Download Claude</text>
<text x="70" y="202" class="sub">Get the desktop app for macOS and Windows.</text>

<rect x="70" y="232" width="252" height="48" rx="8" fill="#12141a"/>
<text x="196" y="262" class="btnT" text-anchor="middle">Download for macOS</text>

<!-- annotation -->
<rect x="60" y="222" width="272" height="68" rx="12" fill="none" stroke="#d93025" stroke-width="2.5"/>
<path d="M348 256 L392 256" stroke="#d93025" stroke-width="2.5"/>
<path d="M348 256 l10 -5 v10 z" fill="#d93025"/>
<text x="400" y="260" class="ann">the download button</text>

<text x="70" y="330" class="lbl">Other platforms:   Windows   ·   macOS (Apple silicon)   ·   Linux</text>
<line x1="70" y1="360" x2="500" y2="360" stroke="#e3e6ea"/>
<text x="70" y="390" class="sub">The page detects your operating system and offers the matching installer.</text>
<text x="70" y="414" class="sub">macOS downloads a .dmg file; Windows downloads an .exe file.</text>

<text x="840" y="502" class="tag" text-anchor="end">Illustration · not a screenshot · your screen may differ</text>
</svg>
