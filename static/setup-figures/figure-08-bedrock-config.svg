<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" role="img" aria-label="Diagram of the Connection panel, with the provider set to Bedrock Mantle, credential kind Static API key, AWS region us-east-1, the Bedrock base URL, a masked AWS bearer token, and the default model card anthropic.claude-sonnet-5; the fields are numbered to match the steps in the guide">
<style>
  text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .ttl  { font-size: 13.5px; font-weight: 600; fill: #3c4149; }
  .lbl  { font-size: 12px; font-weight: 600; fill: #5a616b; letter-spacing: 0.02em; }
  .val  { font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 12.5px; fill: #23272e; }
  .valS { font-size: 13px; fill: #23272e; }
  .num  { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .btn  { font-size: 13.5px; fill: #23272e; }
  .btnP { font-size: 13.5px; font-weight: 600; fill: #ffffff; }
  .btnS { font-size: 11px; font-weight: 600; fill: #23272e; }
  .warn { font-size: 12.5px; font-weight: 600; fill: #d93025; }
  .tag  { font-size: 11px; fill: #8a9099; }
</style>

<rect width="860" height="540" fill="#eef1f4"/>

<!-- window -->
<rect x="170" y="40" width="520" height="420" rx="10" fill="#ffffff" stroke="#c3c8cf"/>
<path d="M170 50 a10 10 0 0 1 10 -10 h500 a10 10 0 0 1 10 10 v26 h-520 z" fill="#f1f3f5"/>
<line x1="170" y1="76" x2="690" y2="76" stroke="#dfe3e7"/>
<circle cx="190" cy="58" r="5.5" fill="#ff5f57"/>
<text x="430" y="63" class="ttl" text-anchor="middle">Connection</text>
<text x="218" y="95" class="tag">Choose where Claude Desktop sends inference requests.</text>

<!-- 1 provider -->
<circle cx="196" cy="129" r="11" fill="#d93025"/>
<text x="196" y="133" class="num" text-anchor="middle">1</text>
<text x="218" y="112" class="lbl">PROVIDER</text>
<rect x="218" y="117" width="442" height="24" rx="5" fill="#fbfbfc" stroke="#d7dbe0"/>
<text x="232" y="134" class="valS">Bedrock Mantle</text>
<text x="646" y="134" class="valS" text-anchor="end">▾</text>

<!-- credentials section -->
<text x="218" y="167" class="lbl">BEDROCK MANTLE CREDENTIALS</text>
<rect x="560" y="152" width="100" height="22" rx="5" fill="#ffffff" stroke="#c4c9d0"/>
<text x="610" y="167" class="btnS" text-anchor="middle">Test connection</text>
<line x1="218" y1="178" x2="660" y2="178" stroke="#e6e9ec"/>

<!-- 2 credential kind -->
<circle cx="196" cy="209" r="11" fill="#d93025"/>
<text x="196" y="213" class="num" text-anchor="middle">2</text>
<text x="218" y="192" class="lbl">CREDENTIAL KIND</text>
<rect x="218" y="197" width="442" height="24" rx="5" fill="#fbfbfc" stroke="#d7dbe0"/>
<text x="232" y="214" class="valS">Static API key</text>
<text x="646" y="214" class="valS" text-anchor="end">▾</text>

<!-- 3 region -->
<circle cx="196" cy="253" r="11" fill="#d93025"/>
<text x="196" y="257" class="num" text-anchor="middle">3</text>
<text x="218" y="236" class="lbl">AWS REGION <tspan fill="#d93025">*</tspan></text>
<rect x="218" y="241" width="442" height="24" rx="5" fill="#fbfbfc" stroke="#d7dbe0"/>
<text x="232" y="258" class="val">us-east-1</text>

<!-- 4 base URL -->
<circle cx="196" cy="297" r="11" fill="#d93025"/>
<text x="196" y="301" class="num" text-anchor="middle">4</text>
<text x="218" y="280" class="lbl">BEDROCK BASE URL</text>
<rect x="218" y="285" width="442" height="24" rx="5" fill="#fbfbfc" stroke="#d7dbe0"/>
<text x="232" y="302" class="val">https://bedrock-mantle.us-east-1.api.aws/anthropic</text>

<!-- 5 bearer token -->
<circle cx="196" cy="341" r="11" fill="#d93025"/>
<text x="196" y="345" class="num" text-anchor="middle">5</text>
<text x="218" y="324" class="lbl">AWS BEARER TOKEN <tspan fill="#d93025">*</tspan></text>
<rect x="218" y="329" width="442" height="24" rx="5" fill="#fbfbfc" stroke="#d7dbe0"/>
<text x="232" y="346" class="val">bdrk-••••••••••••••••••••••••</text>
<path d="M632 341 q10 -7.5 20 0 q-10 7.5 -20 0" fill="none" stroke="#8a9099" stroke-width="1.2"/>
<circle cx="642" cy="341" r="2.6" fill="none" stroke="#8a9099" stroke-width="1.2"/>

<!-- 7 model card -->
<circle cx="196" cy="385" r="11" fill="#d93025"/>
<text x="196" y="389" class="num" text-anchor="middle">7</text>
<text x="218" y="368" class="lbl">DEFAULT MODEL CARD</text>
<rect x="218" y="373" width="442" height="24" rx="5" fill="#fbfbfc" stroke="#d7dbe0"/>
<text x="232" y="390" class="val">anthropic.claude-sonnet-5</text>

<!-- buttons -->
<rect x="470" y="410" width="88" height="30" rx="6" fill="#ffffff" stroke="#c4c9d0"/>
<text x="514" y="430" class="btn" text-anchor="middle">Cancel</text>
<rect x="572" y="410" width="88" height="30" rx="6" fill="#12141a"/>
<text x="616" y="430" class="btnP" text-anchor="middle">Save</text>

<text x="170" y="475" class="tag">Step 6 — Artifact preview iframe origin and Custom inference headers stay empty, and are not drawn here.</text>
<text x="170" y="494" class="warn">The bearer token here is masked on purpose. Never publish or share a figure containing a live key.</text>
<text x="840" y="514" class="tag" text-anchor="end">Illustration · not a screenshot · your screen may differ</text>
</svg>
